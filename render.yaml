services:
  - type: web
    name: electricity-lagrange-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health
